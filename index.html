<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3d9bf; --pill:rgba(255,255,255,.55); --pill-line:rgba(255,255,255,.75);
  --ink:#5b4636; --ink-active:#2b2118; --chip:#ffffff; --hint:rgba(43,33,24,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1a3c; }
}
:root[data-theme="dark"]{ --bg:#0b1a3c; }
body[data-mode="night"]{
  --pill:rgba(20,32,70,.45); --pill-line:rgba(160,185,255,.22);
  --ink:#b9c6ea; --ink-active:#0f1a38; --chip:#e9eeff; --hint:rgba(220,228,255,.6);
}
body[data-mode="morning"]{ --ink:#4a5560; --ink-active:#1f262d; --hint:rgba(31,38,45,.55); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;font-family:'Manrope',system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

.modes{
  position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  display:flex;gap:2px;padding:4px;border-radius:999px;z-index:5;
  background:var(--pill);border:1px solid var(--pill-line);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 6px 24px -10px rgba(0,0,0,.35);
  transition:background .8s ease,border-color .8s ease;
}
.modes button{
  display:flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;
  padding:7px 13px;border-radius:999px;color:var(--ink);font:600 12.5px/1 'Manrope',system-ui,sans-serif;
  transition:background .35s ease,color .35s ease,box-shadow .35s ease;
}
.modes button svg{width:14px;height:14px;flex:none}
.modes button[aria-pressed="true"]{background:var(--chip);color:var(--ink-active);box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}
.modes button:focus-visible{outline:2px solid var(--chip);outline-offset:2px}

.hint{
  position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;
  text-align:center;color:var(--hint);font:500 13px/1.4 'Manrope',system-ui,sans-serif;margin:0;
  transition:opacity 1.2s ease,color .8s ease;pointer-events:none;
}
.hint.gone{opacity:0}
.fallback{position:fixed;inset:0;display:none;place-items:center;color:#5b4636;font:500 15px 'Manrope',sans-serif;text-align:center;padding:24px}
</style>
</head>
<body data-mode="golden">

<nav class="modes" aria-label="Time of day">
  <button type="button" data-mode="morning" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Morning</button>
  <button type="button" data-mode="golden" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 7v2M5.6 10.6l1.4 1.4M18.4 10.6l-1.4 1.4"/></svg>Golden</button>
  <button type="button" data-mode="night" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Night</button>
</nav>
<p class="hint" id="hint">Move through the grass</p>
<div class="fallback" id="fallback">This scene needs WebGL, which isn’t available in this browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('fallback').style.display='grid'; return; }
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var small  = Math.min(innerWidth, innerHeight) < 700;

/* ── renderer, scene, camera ───────────────────────────── */
var renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'}); }
catch(e){ document.getElementById('fallback').style.display='grid'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1, small?1.5:2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf3d2b4, 8, 42);
var camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 400);
var camBase = new THREE.Vector3(0, 1.95, 9.2), lookAt = new THREE.Vector3(0, 1.25, -12);
camera.position.copy(camBase); camera.lookAt(lookAt);

/* ── terrain ───────────────────────────────────────────── */
function h(x,z){
  var dz=z+16, r2=x*x*0.55+dz*dz;
  return 3.3*Math.exp(-r2/(2*7.8*7.8)) + 0.22*Math.sin(x*0.31)*Math.cos(z*0.27) - 0.35;
}
var groundGeo = new THREE.PlaneGeometry(90, 70, 120, 100);
groundGeo.rotateX(-Math.PI/2);
groundGeo.translate(0,0,-14);
var gp = groundGeo.attributes.position;
for(var i=0;i<gp.count;i++){ gp.setY(i, h(gp.getX(i), gp.getZ(i))); }
groundGeo.computeVertexNormals();
var groundMat = new THREE.MeshLambertMaterial({color:0x4d7a22});
var ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

/* ── lights ────────────────────────────────────────────── */
var hemi = new THREE.HemisphereLight(0xffd9b0, 0x5a6b2a, 0.9); scene.add(hemi);
var sun  = new THREE.DirectionalLight(0xffd29a, 1.0); scene.add(sun);

/* ── sky dome with sun / moon disc ─────────────────────── */
var skyU = {
  uZenith:{value:new THREE.Color()}, uHorizon:{value:new THREE.Color()},
  uSunCol:{value:new THREE.Color()}, uSunDir:{value:new THREE.Vector3(0.5,0.1,-1)},
  uGlow:{value:1}
};
var sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite:false, fog:false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: [
    'uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uSunCol; uniform vec3 uSunDir; uniform float uGlow;',
    'varying vec3 vDir;',
    'void main(){',
    ' vec3 d = normalize(vDir);',
    ' float h = clamp(d.y*1.5+0.04, 0.0, 1.0);',
    ' vec3 col = mix(uHorizon, uZenith, pow(h, 0.65));',
    ' float s = max(dot(d, normalize(uSunDir)), 0.0);',
    ' col += uSunCol * (pow(s, 10.0)*0.22*uGlow + pow(s, 160.0)*0.55);',
    ' float disc = smoothstep(0.99925, 0.99955, s);',
    ' col = mix(col, uSunCol, disc);',
    ' gl_FragColor = vec4(col, 1.0);',
    '}'].join('\n')
}));
sky.renderOrder = -1;
scene.add(sky);

/* ── the tree on the hill ──────────────────────────────── */
var treeMat = new THREE.MeshLambertMaterial({color:0x4a4a2a});
var tree = new THREE.Group();
var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 2.2, 7), treeMat);
trunk.position.y = 1.1; tree.add(trunk);
var blobs = [[0,2.6,0,1.25],[-0.95,2.3,0.2,0.9],[0.95,2.35,-0.1,0.95],[0.3,3.25,0.1,0.85],[-0.4,3.1,-0.3,0.8],[0.55,2.0,0.45,0.7],[-0.6,1.95,-0.35,0.65]];
blobs.forEach(function(b){
  var m = new THREE.Mesh(new THREE.IcosahedronGeometry(b[3], 1), treeMat);
  m.position.set(b[0],b[1],b[2]); tree.add(m);
});
tree.scale.setScalar(1.25);
tree.position.set(0.4, h(0.4,-16)-0.1, -16);
scene.add(tree);

/* ── grass: one instanced blade drawn many times ───────── */
var COUNT = small ? 32000 : 72000;
var SEG = 4, bladeW = 0.075;
var base = new THREE.BufferGeometry();
var verts=[], idx=[];
for(var s=0;s<SEG;s++){
  var t=s/SEG, w=bladeW*(1-t*0.85);
  verts.push(-w/2, t, 0,  w/2, t, 0);
}
verts.push(0,1,0);
for(var s2=0;s2<SEG-1;s2++){
  var a=s2*2; idx.push(a,a+1,a+2, a+1,a+3,a+2);
}
var lastL=(SEG-1)*2; idx.push(lastL,lastL+1,SEG*2);
base.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
base.setIndex(idx);

var geo = new THREE.InstancedBufferGeometry();
geo.index = base.index;
geo.attributes.position = base.attributes.position;
var offs=new Float32Array(COUNT*3), scl=new Float32Array(COUNT), ang=new Float32Array(COUNT), shd=new Float32Array(COUNT);
for(var k=0;k<COUNT;k++){
  var z = -26 + Math.pow(Math.random(),0.75)*33;          // denser toward the camera
  var x = (Math.random()*2-1) * (14 + (z+26)*0.15);
  offs[k*3]=x; offs[k*3+1]=h(x,z); offs[k*3+2]=z;
  var near = THREE.MathUtils.clamp((z+6)/12, 0, 1);
  scl[k] = (0.38 + Math.random()*0.5) * (0.9 + near*0.3);
  ang[k] = Math.random()*Math.PI;
  shd[k] = Math.random();
}
geo.setAttribute('offset', new THREE.InstancedBufferAttribute(offs,3));
geo.setAttribute('scale',  new THREE.InstancedBufferAttribute(scl,1));
geo.setAttribute('angle',  new THREE.InstancedBufferAttribute(ang,1));
geo.setAttribute('shade',  new THREE.InstancedBufferAttribute(shd,1));
geo.instanceCount = COUNT;

var grassU = {
  uTime:{value:0}, uMouse:{value:new THREE.Vector2(999,999)}, uPush:{value:0},
  uBase:{value:new THREE.Color()}, uTip:{value:new THREE.Color()}, uLight:{value:new THREE.Color()},
  uFog:{value:new THREE.Color()}, uFogNear:{value:8}, uFogFar:{value:42}, uWind:{value:1}
};
var grass = new THREE.Mesh(geo, new THREE.ShaderMaterial({
  uniforms: grassU, side: THREE.DoubleSide,
  vertexShader: [
    'attribute vec3 offset; attribute float scale; attribute float angle; attribute float shade;',
    'uniform float uTime; uniform vec2 uMouse; uniform float uPush; uniform float uWind;',
    'varying float vT; varying float vShade; varying float vDepth;',
    'void main(){',
    ' vec3 p = position; float t = p.y;',
    ' p.y *= scale; p.x *= 0.7 + 0.3*scale;',
    ' float c = cos(angle), s = sin(angle);',
    ' p = vec3(p.x*c, p.y, p.x*s);',
    ' float bend = t*t;',
    ' float w = sin(uTime*1.25 + offset.x*0.33 + offset.z*0.21)*0.55 + sin(uTime*2.3 + offset.x*0.9 + offset.z*0.4)*0.18;',
    ' p.x += w*0.32*bend*scale*uWind;',
    ' p.z += w*0.10*bend*scale*uWind;',
    ' vec2 d = offset.xz - uMouse; float dist = length(d);',
    ' float f = smoothstep(1.7, 0.0, dist) * uPush;',
    ' vec2 dir = dist > 0.001 ? d/dist : vec2(0.0, 1.0);',
    ' p.xz += dir * f * 1.05 * bend * scale;',
    ' p.y  -= f * 0.42 * t * scale;',
    ' vec4 mv = modelViewMatrix * vec4(p + offset, 1.0);',
    ' vT = t; vShade = shade; vDepth = -mv.z;',
    ' gl_Position = projectionMatrix * mv;',
    '}'].join('\n'),
  fragmentShader: [
    'uniform vec3 uBase; uniform vec3 uTip; uniform vec3 uLight; uniform vec3 uFog;',
    'uniform float uFogNear; uniform float uFogFar;',
    'varying float vT; varying float vShade; varying float vDepth;',
    'void main(){',
    ' vec3 col = mix(uBase, uTip, smoothstep(0.0, 1.0, vT));',
    ' col *= 0.78 + vShade*0.42;',
    ' col += uLight * pow(vT, 3.0) * 0.14;',
    ' float f = smoothstep(uFogNear, uFogFar, vDepth);',
    ' gl_FragColor = vec4(mix(col, uFog, f), 1.0);',
    '}'].join('\n')
}));
grass.frustumCulled = false;
scene.add(grass);

/* ── flowers (day) ─────────────────────────────────────── */
var FL = small ? 260 : 520;
var fPos=new Float32Array(FL*3), fCol=new Float32Array(FL*3);
var palette=[new THREE.Color(0xe8607a), new THREE.Color(0xf2c14e), new THREE.Color(0x7b8cf0), new THREE.Color(0xf09ac0)];
for(var q=0;q<FL;q++){
  var fz=-14+Math.random()*20, fx=(Math.random()*2-1)*11;
  fPos[q*3]=fx; fPos[q*3+1]=h(fx,fz)+0.25+Math.random()*0.25; fPos[q*3+2]=fz;
  var pc=palette[q%palette.length]; fCol[q*3]=pc.r; fCol[q*3+1]=pc.g; fCol[q*3+2]=pc.b;
}
var flowerGeo=new THREE.BufferGeometry();
flowerGeo.setAttribute('position', new THREE.BufferAttribute(fPos,3));
flowerGeo.setAttribute('color', new THREE.BufferAttribute(fCol,3));
var flowerMat=new THREE.PointsMaterial({size:0.14, vertexColors:true, sizeAttenuation:true, transparent:true, opacity:1});
var flowers=new THREE.Points(flowerGeo, flowerMat);
scene.add(flowers);

/* ── glow: fireflies + luminous seed heads (night) ─────── */
function glowPoints(n, spread, sizeMin, sizeMax, drift, clusters){
  var pos=new Float32Array(n*3), seed=new Float32Array(n), size=new Float32Array(n);
  for(var i=0;i<n;i++){
    var x,z;
    if(clusters){ var c=clusters[i%clusters.length]; x=c[0]+(Math.random()-0.5)*c[2]; z=c[1]+(Math.random()-0.5)*c[2]*0.6; }
    else { x=(Math.random()*2-1)*spread.x; z=spread.z0+Math.random()*(spread.z1-spread.z0); }
    pos[i*3]=x; pos[i*3+1]=h(x,z)+(clusters?0.35+Math.random()*0.45:0.4+Math.random()*2.4); pos[i*3+2]=z;
    seed[i]=Math.random(); size[i]=sizeMin+Math.random()*(sizeMax-sizeMin);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed,1));
  g.setAttribute('size', new THREE.BufferAttribute(size,1));
  var m=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}, uOn:{value:0}, uCol:{value:new THREE.Color(drift?0xd8ff7a:0xf4f8ff)}, uDrift:{value:drift?1:0}, uScale:{value:renderer.getPixelRatio()}},
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:[
      'attribute float seed; attribute float size; uniform float uTime; uniform float uDrift; uniform float uScale; varying float vA;',
      'void main(){ vec3 p=position;',
      ' p.x += uDrift*sin(uTime*0.45+seed*20.0)*0.7; p.y += uDrift*sin(uTime*0.7+seed*13.0)*0.35; p.z += uDrift*cos(uTime*0.38+seed*9.0)*0.5;',
      ' vec4 mv=modelViewMatrix*vec4(p,1.0);',
      ' vA = uDrift>0.5 ? 0.35+0.65*pow(0.5+0.5*sin(uTime*2.2+seed*30.0),2.0) : 0.55+0.45*sin(uTime*1.3+seed*17.0);',
      ' gl_PointSize = size*uScale*(260.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv; }'].join('\n'),
    fragmentShader:[
      'uniform vec3 uCol; uniform float uOn; varying float vA;',
      'void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.0,d); a=a*a;',
      ' gl_FragColor=vec4(uCol*(1.0+a), a*vA*uOn); }'].join('\n')
  });
  var pts=new THREE.Points(g,m); pts.frustumCulled=false; return pts;
}
var fireflies = glowPoints(small?55:110, {x:9, z0:-13, z1:5}, 0.14, 0.3, true);
var seeds = glowPoints(small?260:520, null, 0.03, 0.07, false, [[-3.2,-4.5,3.2],[3.6,-3.0,3.6],[0.8,-9.5,4.2]]);
scene.add(fireflies); scene.add(seeds);

/* ── the three looks, plus a dusk stop for the sunset ──── */
var P = {
  morning:{ zen:0xb7d0e6, hor:0xeef0e8, sunCol:0xfffaf0, sunDir:[0.18,0.42,-1], glow:0.7,
    light:0xfff6e8, li:0.95, hemiS:0xdfeaf5, hemiG:0x607a3a, hi:0.95,
    base:0x2a5418, tip:0xa7cc5e, fog:0xe4e9e4, fn:7, ff:40, ground:0x3f6b20, tree:0x6f705c,
    flowers:0.9, night:0 },
  golden:{ zen:0xeaa98b, hor:0xfde1c4, sunCol:0xfff1d6, sunDir:[0.42,0.12,-1], glow:1.0,
    light:0xffcf94, li:1.1, hemiS:0xffd9b0, hemiG:0x5a6b2a, hi:0.9,
    base:0x3a6a18, tip:0xd0dc6a, fog:0xf3d2b4, fn:8, ff:42, ground:0x4d7a22, tree:0x4e4a2c,
    flowers:1, night:0 },
  dusk:{ zen:0x9a5a8c, hor:0xf3a093, sunCol:0xffc7a6, sunDir:[0.42,0.01,-1], glow:1.1,
    light:0xff9d8a, li:0.7, hemiS:0xd88aa0, hemiG:0x3a2f2a, hi:0.75,
    base:0x3a3a1c, tip:0xb8805c, fog:0xe5948f, fn:6, ff:36, ground:0x4a4224, tree:0x3a2c2c,
    flowers:0.75, night:0.35 },
  night:{ zen:0x0a1838, hor:0x27427c, sunCol:0xf2f4ff, sunDir:[-0.34,0.34,-1], glow:0.55,
    light:0x8fb2ff, li:0.45, hemiS:0x34508f, hemiG:0x0b1f22, hi:0.7,
    base:0x082022, tip:0x2b8274, fog:0x1d3462, fn:6, ff:34, ground:0x0f2a2a, tree:0x0f1b2c,
    flowers:0.45, night:1 }
};
function snap(){
  return { zen:skyU.uZenith.value.clone(), hor:skyU.uHorizon.value.clone(), sunCol:skyU.uSunCol.value.clone(),
    sunDir:skyU.uSunDir.value.clone(), glow:skyU.uGlow.value, light:sun.color.clone(), li:sun.intensity,
    hemiS:hemi.color.clone(), hemiG:hemi.groundColor.clone(), hi:hemi.intensity,
    base:grassU.uBase.value.clone(), tip:grassU.uTip.value.clone(), fog:scene.fog.color.clone(),
    fn:scene.fog.near, ff:scene.fog.far, ground:groundMat.color.clone(), tree:treeMat.color.clone(),
    flowers:flowerMat.opacity, night:fireflies.material.uniforms.uOn.value };
}
var tmpC=new THREE.Color(), tmpV=new THREE.Vector3();
function C(hex){ return tmpC.set(hex).clone(); }
function apply(a, bp, e){
  var b = { zen:C(bp.zen), hor:C(bp.hor), sunCol:C(bp.sunCol), sunDir:tmpV.fromArray(bp.sunDir).clone(),
    light:C(bp.light), hemiS:C(bp.hemiS), hemiG:C(bp.hemiG), base:C(bp.base), tip:C(bp.tip),
    fog:C(bp.fog), ground:C(bp.ground), tree:C(bp.tree) };
  skyU.uZenith.value.copy(a.zen).lerp(b.zen,e);
  skyU.uHorizon.value.copy(a.hor).lerp(b.hor,e);
  skyU.uSunCol.value.copy(a.sunCol).lerp(b.sunCol,e);
  skyU.uSunDir.value.copy(a.sunDir).lerp(b.sunDir,e);
  skyU.uGlow.value = a.glow + (bp.glow-a.glow)*e;
  sun.color.copy(a.light).lerp(b.light,e); sun.intensity = a.li+(bp.li-a.li)*e;
  sun.position.copy(skyU.uSunDir.value).multiplyScalar(30);
  hemi.color.copy(a.hemiS).lerp(b.hemiS,e); hemi.groundColor.copy(a.hemiG).lerp(b.hemiG,e); hemi.intensity=a.hi+(bp.hi-a.hi)*e;
  grassU.uBase.value.copy(a.base).lerp(b.base,e); grassU.uTip.value.copy(a.tip).lerp(b.tip,e);
  grassU.uLight.value.copy(sun.color);
  scene.fog.color.copy(a.fog).lerp(b.fog,e); scene.fog.near=a.fn+(bp.fn-a.fn)*e; scene.fog.far=a.ff+(bp.ff-a.ff)*e;
  grassU.uFog.value.copy(scene.fog.color); grassU.uFogNear.value=scene.fog.near; grassU.uFogFar.value=scene.fog.far;
  groundMat.color.copy(a.ground).lerp(b.ground,e); treeMat.color.copy(a.tree).lerp(b.tree,e);
  flowerMat.opacity = a.flowers+(bp.flowers-a.flowers)*e;
  flowerMat.color.setScalar(0.45+0.55*(1-(a.night+(bp.night-a.night)*e)));
  var n = a.night+(bp.night-a.night)*e;
  fireflies.material.uniforms.uOn.value = n; seeds.material.uniforms.uOn.value = n;
  document.documentElement.style.setProperty('--bg', '#'+scene.fog.color.getHexString());
}
// start in golden hour
apply(snap(), P.golden, 1);

/* ── switching modes ───────────────────────────────────── */
var current='golden', queue=[], seg=null;
function go(mode){
  if(mode===current && !seg) return;
  var path=[mode];
  if((current==='golden'&&mode==='night')||(current==='night'&&mode==='golden')) path=['dusk',mode];
  queue=path.slice(); current=mode; next();
  document.body.dataset.mode=mode;
  document.querySelectorAll('.modes button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.mode===mode?'true':'false'); });
}
function next(){
  if(!queue.length){ seg=null; return; }
  var key=queue.shift();
  seg={from:snap(), to:P[key], t0:performance.now(), dur:reduce?1:(queue.length?1300:1700)};
}
document.querySelectorAll('.modes button').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.mode); }); });
addEventListener('keydown', function(e){ if(e.key==='1')go('morning'); if(e.key==='2')go('golden'); if(e.key==='3')go('night'); });

/* ── pointer → point on the ground ─────────────────────── */
var ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), target=new THREE.Vector2(999,999), pushTarget=0;
var cam = {x:0,y:0};
var hint=document.getElementById('hint'), hinted=false;
function onMove(e){
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  cam.x=ndc.x; cam.y=ndc.y;
  ray.setFromCamera(ndc, camera);
  var hit=ray.intersectObject(ground)[0];
  if(hit){ target.set(hit.point.x, hit.point.z); pushTarget=1; }
  if(!hinted){ hinted=true; setTimeout(function(){ hint.classList.add('gone'); }, 1800); }
}
renderer.domElement.addEventListener('pointermove', onMove);
renderer.domElement.addEventListener('pointerdown', onMove);
renderer.domElement.addEventListener('pointerleave', function(){ pushTarget=0; });

/* ── loop ──────────────────────────────────────────────── */
var clock=new THREE.Clock(), mouse=grassU.uMouse.value;
function ease(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function frame(){
  var dt=Math.min(clock.getDelta(), 0.05), tt=clock.elapsedTime;
  grassU.uTime.value = tt;
  fireflies.material.uniforms.uTime.value = tt; seeds.material.uniforms.uTime.value = tt;
  grassU.uWind.value = reduce ? 0.35 : 1;

  var k = 1-Math.pow(0.0015, dt);            // frame-rate independent follow
  if(mouse.x>900){ mouse.copy(target); } else { mouse.lerp(target, k); }
  grassU.uPush.value += (pushTarget-grassU.uPush.value)*k*0.8;

  if(!reduce){
    camera.position.x += (camBase.x + cam.x*0.35 - camera.position.x)*k*0.25;
    camera.position.y += (camBase.y + cam.y*0.12 - camera.position.y)*k*0.25;
    camera.lookAt(lookAt);
  }
  if(seg){
    var p=Math.min(1,(performance.now()-seg.t0)/seg.dur);
    apply(seg.from, seg.to, ease(p));
    if(p>=1) next();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', function(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
</body>
